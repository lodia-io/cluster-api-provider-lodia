# @todo: workaround, undo it as the item "Ship the kubeadm bootstrap provider's access" in ../../todo.md says
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capi-kubeadm-bootstrap-lodia-controlplane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: capi-kubeadm-bootstrap-lodia-controlplane
subjects:
# clusterctl sets the namespace of every subject that has one to the provider's own, so a ServiceAccount subject would name a ServiceAccount that does not exist: the subject is the user that the ServiceAccount authenticates as, whose namespace and name are variables.
# https://github.com/kubernetes-sigs/cluster-api/blob/v1.15.0-beta.0/cmd/clusterctl/client/repository/components.go#L349-L384
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: system:serviceaccount:${LODIA_KUBEADM_BOOTSTRAP_SA_NAMESPACE:=capi-kubeadm-bootstrap-system}:${LODIA_KUBEADM_BOOTSTRAP_SA_NAME:=capi-kubeadm-bootstrap-manager}
