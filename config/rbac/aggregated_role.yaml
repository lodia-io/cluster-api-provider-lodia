apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: capi-lodia-controlplane
  labels:
    cluster.x-k8s.io/aggregate-to-manager: "true"
rules:
- apiGroups:
  - controlplane.lodia.io
  resources:
  - lodiacontrolplanes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - controlplane.lodia.io
  resources:
  - lodiacontrolplanetemplates
  verbs:
  - get
  - list
  - patch
  - update
  - watch
