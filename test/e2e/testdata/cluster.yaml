apiVersion: v1
kind: Namespace
metadata:
  name: capi-join
---
apiVersion: lodia.io/v1alpha1
kind: DatastoreClass
metadata:
  name: e2e-capi
spec:
  storage:
    size: 8Gi
    reclaimPolicy: Delete
---
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-join
spec:
  clusterNetwork:
    services:
      cidrBlocks:
      - 10.32.0.0/16
    pods:
      cidrBlocks:
      - 10.200.0.0/16
    serviceDomain: cluster.local
  controlPlaneRef:
    apiGroup: controlplane.lodia.io
    kind: LodiaControlPlane
    name: ${CLUSTER_NAME}
  infrastructureRef:
    apiGroup: infrastructure.cluster.x-k8s.io
    kind: DevCluster
    name: ${CLUSTER_NAME}
---
apiVersion: controlplane.lodia.io/v1alpha1
kind: LodiaControlPlane
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-join
spec:
  version: v1.37.0
  datastore:
    dedicated:
      className: e2e-capi
  endpoint:
    nodePort: {}
  addons:
    kubeProxy:
      conntrack:
        maxPerCore: 0
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta2
kind: DevCluster
metadata:
  name: ${CLUSTER_NAME}
  namespace: capi-join
  annotations:
    cluster.x-k8s.io/managed-by: e2e
spec:
  backend:
    docker: {}
